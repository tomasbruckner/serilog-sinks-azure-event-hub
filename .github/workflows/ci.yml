name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  publish:
    # Publish only from main, and only after build + test pass (never from PRs or dev).
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for creating the GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read package version
        id: version
        run: echo "value=$(grep -oP '(?<=<VersionPrefix>)[^<]+' src/Serilog.Sinks.AzureEventHub/Serilog.Sinks.AzureEventHub.csproj)" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack src/Serilog.Sinks.AzureEventHub/Serilog.Sinks.AzureEventHub.csproj -c Release -o artifacts

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Skip if the release already exists, so re-running publish after a partial
        # failure (or a push that didn't bump the version) does not fail the job.
        run: >
          gh release view "v${{ steps.version.outputs.value }}" >/dev/null 2>&1
          || gh release create "v${{ steps.version.outputs.value }}" artifacts/*.nupkg
          --title "v${{ steps.version.outputs.value }}"
          --generate-notes
